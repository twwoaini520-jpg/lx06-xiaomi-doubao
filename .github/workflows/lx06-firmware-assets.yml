name: Prepare LX06 firmware files

on:
  push:
    paths:
      - .github/workflows/lx06-firmware-assets.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download the public LX06 1.94.13 release files
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/idootop/open-xiaoai/releases/download/LX06_1.94.13
          mkdir firmware
          for file in LX06_1.94.13.squashfs LX06_1.94.13_patched.squashfs; do
            curl --fail --location --retry 3 --connect-timeout 15 -o "firmware/$file" "$base/$file"
          done
          cd firmware
          printf '%s  %s\n' \
            317a54909f12b63f22128965bf9005c06435d15f61c4202bb88c4524bf1e2ef4 LX06_1.94.13.squashfs \
            3fbcfcd8a2130f5421d0bc3a3b22cb5a3de59b5d3678a3a14b23541aa9474225 LX06_1.94.13_patched.squashfs > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Upload checked release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lx06-firmware-1.94.13
          path: firmware/
          if-no-files-found: error
          retention-days: 3

