name: Inspect USB driver package

on:
  push:
    paths:
      - .github/workflows/lx06-usb-driver.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch the public Khadas driver archive for inspection
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 15 \
            -o khadas-usb-driver.zip https://dl.khadas.com/products/vim1s/tools/usb-driver.zip
          test "$(stat -c %s khadas-usb-driver.zip)" = 5955932
          sha256sum khadas-usb-driver.zip > khadas-usb-driver.zip.sha256
          unzip -t khadas-usb-driver.zip >/dev/null

      - name: Upload archive for inspection only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lx06-driver-inspection
          path: |
            khadas-usb-driver.zip
            khadas-usb-driver.zip.sha256
          if-no-files-found: error
          retention-days: 3

